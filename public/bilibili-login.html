<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>连接 B站 · 英语精听工作室</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#294260;font:16px/1.7 system-ui,"Microsoft YaHei",sans-serif}main{max-width:470px;margin:40px auto;padding:0 18px}.back{font-size:14px;color:#537da7;text-decoration:none}h1{font-size:29px;margin:20px 0 8px}p{margin:10px 0}.muted{color:#708399;font-size:14px}.card{margin:24px 0;padding:25px 22px;border:1px solid #dbe4ef;border-radius:18px;background:#fff;text-align:center;box-shadow:0 10px 35px #29426008}#qr{width:240px;height:240px;max-width:100%;object-fit:contain;display:block;margin:20px auto}#qr[hidden]{display:none}#status{font-size:18px;font-weight:650;color:#345c88}#remaining{font-size:14px;min-height:24px;color:#71859d}.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:20px 0 8px}button,.actions a{font:inherit;font-size:14px;border:1px solid #c9d8e9;border-radius:9px;background:#f6f9fe;color:#365e8b;padding:10px 15px;cursor:pointer;text-decoration:none}button:disabled{opacity:.5;cursor:default}.primary{background:#375f8b!important;color:#fff!important}#error{font-size:14px;color:#a13e40;overflow-wrap:anywhere;white-space:pre-wrap}#success{color:#357452;font-weight:600}details{text-align:left;font-size:13px;color:#71859d;margin-top:18px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.6 system-ui}button:focus-visible,a:focus-visible{outline:3px solid #e3b04a;outline-offset:3px}@media(max-width:400px){main{margin:20px auto}.card{padding:20px 14px}h1{font-size:25px}#qr{width:220px;height:220px}}.embedded body{background:#fff}.embedded main{margin:0 auto;padding:12px}.embedded .back,.embedded h1,.embedded main>p,.embedded .actions a{display:none}.embedded .card{margin:0;padding:16px 10px;border:0;box-shadow:none}.embedded #qr{width:220px;height:220px}.embedded details{max-height:120px;overflow:auto}</style></head>
<body><main><a class="back" href="/#creator-workspace">← 返回投稿工作区</a><h1>连接你的 B站账号</h1><p class="muted">用 B站 App 的“扫一扫”，扫描下方实时二维码，再在手机上确认登录。</p>
<section class="card" aria-label="实时扫码登录"><div id="status" role="status">正在获取新二维码…</div><img id="qr" hidden alt="B站实时登录二维码"><div id="remaining"></div><p id="error" role="alert"></p><p id="success" hidden>登录已验证，可以继续投稿。</p><div class="actions"><button id="renew" type="button">重新获取二维码</button><a class="primary" href="/#creator-workspace">返回投稿工作区</a></div><details><summary>连接状态</summary><pre id="diagnostic">正在连接…</pre></details></section>
<p class="muted">打开此页会获取有效二维码，过期后自动换新码。本机后台持续接收手机确认。连接信息加密保存在本机，学习设置、进度和收藏保留。</p></main>
<script>
if(new URLSearchParams(location.search).get('embedded')==='1')document.documentElement.classList.add('embedded');
const el=id=>document.getElementById(id);let session=null,deadline=0,loading=false,polling=false,done=false,renewTimer=0,alive=true,loginGeneration=0;
async function api(path,body){const r=await fetch(path,{method:body===undefined?'GET':'POST',headers:body===undefined?{}:{'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body),cache:'no-store'});const v=await r.json();if(!r.ok)throw Error(v.error||'连接暂未完成，请重试。');return v}
function diagnostic(a){el('diagnostic').textContent=JSON.stringify({当前:a.login_diagnostic||{status:a.status||'等待扫码'},最近:a.login_diagnostic_history||[]},null,2)}
function countdown(){el('remaining').textContent=done?'':session?`二维码约 ${Math.max(0,Math.ceil((deadline-Date.now())/1000))} 秒后换新`:'二维码会自动刷新'}
async function connected(generation=loginGeneration){
  if(!alive||generation!==loginGeneration)return;
  done=true;clearTimeout(renewTimer);el('qr').hidden=true;el('remaining').textContent='';el('status').textContent='手机确认已收到';el('error').textContent='';
  try{
    const a=await api('/api/publishing/verify',{});
    if(!alive||generation!==loginGeneration)return;
    diagnostic(a);
    if(a.verified){el('status').textContent='已连接 B站';el('success').hidden=false}
    else{done=false;el('status').textContent='登录未通过验证，请重新扫码'}
  }catch(e){if(alive&&generation===loginGeneration){el('error').textContent=e.message;el('status').textContent='登录信息已接收，验证暂未完成'}}
}
async function generate(force=false){
  if(loading||!alive)return;
  const generation=++loginGeneration;
  loading=true;done=false;session=null;clearTimeout(renewTimer);el('renew').disabled=true;el('qr').hidden=true;el('success').hidden=true;el('error').textContent='';el('status').textContent='正在获取新二维码…';
  try{
    const s=await api('/api/publishing/login',{reuse:!force});
    if(!alive||generation!==loginGeneration)return;
    session=s;deadline=Date.now()+Math.max(0,s.expires_in||0)*1000;
    if(!/^data:image\/(png|jpeg|webp);base64,/.test(s.qr_image||''))throw Error('二维码图片未就绪，请点击重新获取。');
    el('qr').src=s.qr_image;el('qr').hidden=false;el('status').textContent=s.status==='confirm'?'请在手机上确认登录':'请用 B站 App 扫码';countdown();
  }catch(e){if(alive&&generation===loginGeneration){el('status').textContent='二维码暂未就绪';el('error').textContent=e.message}}
  finally{loading=false;el('renew').disabled=false}
}
async function poll(){
  if(polling||loading||!session||done||!alive)return;
  const generation=loginGeneration,loginId=session.login_id;
  const current=()=>alive&&generation===loginGeneration&&session?.login_id===loginId;
  polling=true;
  try{
    const r=await api('/api/publishing/login/poll',{login_id:loginId});
    if(!current())return;
    if(r.status==='done'){await connected(generation);return}
    const a=await api('/api/publishing');
    if(!current())return;
    diagnostic(a.account);
    if(a.account.configured&&a.account.login_diagnostic?.status==='done'){await connected(generation);return}
    if(['expired','timeout'].includes(r.status)){
      session=null;el('qr').hidden=true;el('status').textContent='正在自动更换新码…';
      if(r.last_error&&!r.last_error.includes('local_expired'))el('error').textContent=r.last_error;
      renewTimer=setTimeout(()=>{if(generation===loginGeneration)void generate(false)},500);return;
    }
    el('status').textContent=r.status==='confirm'||r.status==='scanned'?'扫码已收到，请在手机上确认登录':'请用 B站 App 扫码';
    if(r.last_error)el('error').textContent=r.last_error;
  }catch(e){if(current())el('error').textContent=e.message}
  finally{polling=false}
}
el('renew').onclick=()=>void generate(true);const clock=setInterval(countdown,1000),timer=setInterval(()=>void poll(),2000);window.addEventListener('pageshow',e=>{if(e.persisted)location.reload()});window.addEventListener('pagehide',()=>{alive=false;clearInterval(clock);clearInterval(timer);clearTimeout(renewTimer)});
(async()=>{const renew=new URLSearchParams(location.search).get('renew')==='1';if(!renew){try{const s=await api('/api/publishing');diagnostic(s.account);if(s.account.configured){await connected();if(done)return}}catch{}}await generate(renew)})();
</script></body></html>
